# Render Blueprint - deploy via https://dashboard.render.com/blueprints
# "New +" -> "Blueprint" -> pick this repo -> Render reads this file and
# sets up the service below. Env vars marked sync:false are left blank for
# you to fill in yourself in the Render dashboard (never stored in the repo).
services:
  - type: web
    name: project-exchange-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run seed:admin && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Shared secret checked by POST /api/internal/digest-tick - must match
      # the DIGEST_SECRET repo secret used by .github/workflows/hourly-digest.yml
      - key: DIGEST_SECRET
        sync: false
